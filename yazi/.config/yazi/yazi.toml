[mgr]
show_hidden = false
[opener]
edit = [
  { run = '${EDITOR:-vi} %s', block = true, for = "linux" }
]
play = [
  { run = 'mpv %s', orphan = true, for = "linux" }
]
image = [
  { run = 'imv %s', orphan = true, for = "linux" }
]
pdf = [
  { run = 'mupdf %s', orphan = true, for = "linux" }
]
open = [
  { run = 'xdg-open %s1', desc = "Open", for = "linux" }
]
office = [
  { run = 'libreoffice %s', orphan = true, for = "linux" }
]

[open]
rules = [
  # { name = "*/", use = [ "edit", "open" ]},

  { mime = "application/pdf", use = "pdf" },

  { mime = "video/*", use = "play" },

  { mime = "audio/*", use = "play" },

  { mime = "image/*", use = "image" },

  { mime = "application/vnd.oasis.opendocument.*", use = "office" },

  { mime = "application/vnd.openxmlformats-officedocument.*", use = "office" },

]
