# Modus Themes for Yazi
# Auto generated with https://github.com/miikanissi/modus-themes.nvim/blob/master/lua/modus-themes/extras/yazi.lua
#
# Written against the Yazi theme schema of v26.8.15 and newer.
# Use it either as `~/.config/yazi/theme.toml`, or as the `flavor.toml` of a
# flavor package in `~/.config/yazi/flavors/<name>.yazi/`.
#:schema https://yazi-rs.github.io/schemas/theme.json

[mgr]
# NOTE: can be combined with a tmTheme (Sublime colorscheme file) to highlight
# the code preview, see the `bat` extra for a matching tmTheme
# syntect_theme = "path/to/tmTheme"

cwd = { fg = "#00d3d0", italic = true }

# Find
find_keyword  = { fg = "#ffffff", bg = "#7030af", bold = true }
find_position = { fg = "#79a8ff", bg = "#1e1e1e", bold = true }

# Symlink
symlink_target = { fg = "#989898", italic = true }

# Marker
marker_copied   = { fg = "#70b900", bg = "#70b900" }
marker_cut      = { fg = "#ff5f59", bg = "#ff5f59" }
marker_marked   = { fg = "#feacd0", bg = "#feacd0" }
marker_selected = { fg = "#2fafff", bg = "#2fafff" }

# Count
count_copied   = { fg = "#000000", bg = "#70b900" }
count_cut      = { fg = "#000000", bg = "#ff6b55" }
count_selected = { fg = "#000000", bg = "#79a8ff" }

# Border
border_symbol = "│"
border_style  = { fg = "#C4C4C4" }

# Tabs
[tabs]
active   = { fg = "#000000", bg = "#2fafff", bold = true }
inactive = { fg = "#989898", bg = "#0f0f0f" }

# Mode
[mode]
normal_main = { fg = "#000000", bg = "#2fafff", bold = true }
normal_alt  = { fg = "#2fafff", bg = "#0f0f0f" }

select_main = { fg = "#000000", bg = "#f78fe7", bold = true }
select_alt  = { fg = "#f78fe7", bg = "#0f0f0f" }

unset_main = { fg = "#000000", bg = "#db7b5f", bold = true }
unset_alt  = { fg = "#db7b5f", bg = "#0f0f0f" }

# Indicator of the hovered file
[indicator]
parent  = { bg = "#2f3849" }
current = { bg = "#2f3849" }
preview = { bg = "#2f3849" }

# Status bar
[status]
# Permissions
perm_sep   = { fg = "#989898" }
perm_type  = { fg = "#2fafff" }
perm_read  = { fg = "#d0bc00" }
perm_write = { fg = "#ff5f59" }
perm_exec  = { fg = "#44bc44" }

# Progress
progress_label  = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#2fafff", bg = "#0f0f0f" }
progress_error  = { fg = "#ff5f59", bg = "#0f0f0f" }

# Which
[which]
border          = { fg = "#C4C4C4" }
cols            = 3
mask            = { bg = "#0f0f0f" }
cand            = { fg = "#00d3d0" }
rest            = { fg = "#2fafff" }
desc            = { fg = "#feacd0" }
separator       = "  "
separator_style = { fg = "#989898" }

# Confirmation
[confirm]
border  = { fg = "#C4C4C4" }
title   = { fg = "#2fafff" }
body    = { fg = "#ffffff" }
list    = { fg = "#ffffff" }
btn_yes = { fg = "#000000", bg = "#2fafff", bold = true }
btn_no  = { fg = "#ffffff" }

# Spotter
[spot]
border   = { fg = "#C4C4C4" }
title    = { fg = "#2fafff" }
tbl_col  = { fg = "#2fafff" }
tbl_cell = { fg = "#ffffff", bg = "#2f3849" }

# Notify
[notify]
title_info  = { fg = "#00bcff" }
title_warn  = { fg = "#d0bc00" }
title_error = { fg = "#ff5f59" }

# Picker
[pick]
border   = { fg = "#C4C4C4" }
active   = { fg = "#ffffff", bg = "#646464" }
inactive = { fg = "#ffffff" }

# Input
[input]
border   = { fg = "#00bcff" }
title    = { fg = "#ffffff" }
value    = { fg = "#f78fe7" }
selected = { bg = "#646464" }

# Completion
[cmp]
border   = { fg = "#00bcff" }
active   = { fg = "#ffffff", bg = "#646464" }
inactive = { fg = "#ffffff" }

# Tasks
[tasks]
border  = { fg = "#C4C4C4" }
title   = { fg = "#ffffff" }
hovered = { fg = "#ffffff", bg = "#646464" }

# Help
[help]
border  = { fg = "#C4C4C4" }
chord   = { fg = "#44bc44" }
action  = { fg = "#feacd0" }
hovered = { fg = "#ffffff", bg = "#646464" }

[filetype]

rules = [
	# Images
	{ mime = "**/image/*", fg = "#00d3d0" },

	# Media
	{ mime = "**/{audio,video}/*", fg = "#fec43f" },

	# Archives
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#feacd0" },

	# Documents
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#00d3d0" },
	{ mime = "**/application/vnd.*", fg = "#00d3d0" },

	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "#989898" },

	# Empty files
	# { mime = "**/inode/x-empty", fg = "#ff5f59" },

	# Special files
	{ url = "*" , is = "orphan", fg = "#ffffff", bg = "#9d1f1f" },
	{ url = "*" , is = "dummy" , fg = "#ffffff", bg = "#9d1f1f" },
	{ url = "*/", is = "dummy" , fg = "#ffffff", bg = "#9d1f1f" },
	{ url = "*" , is = "exec"  , fg = "#44bc44" },

	{ url = "*.rs", fg = "#db7b5f" },

	# Fallback
	{ url = "*/", fg = "#2fafff" }
]
    