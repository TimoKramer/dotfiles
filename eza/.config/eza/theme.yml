colourful: true

# Colors are in format of:
# color/paletteRef (Description) #color code

# Authentic Modus Operandi colors from Protesilaos Stavrou's theme
# Base (Primary Background) #ffffff
# Main foreground #000000
# Secondary foreground #505050
# Light foreground #70627f
# Accent blue #354fcf (blue-warmer)
# Accent magenta #531ab6 (magenta-cooler)
# Accent green #005000 (fg-added)
# Accent yellow #884900 (warning)
# Accent cyan #005e8b (variable)
# Accent red #721045 (fg-heading-4)
# Red error #a60000
# Green success #006800
# Blue link #0031a9
# Purple dim #5317ac
# Cyan dim #005a5f
# Yellow dim #7a4f2f

filekinds:
  normal: {foreground: "#000000"}
  directory: {foreground: "#354fcf"}
  symlink: {foreground: "#0031a9"}
  pipe: {foreground: "#505050"}
  block_device: {foreground: "#531ab6"}
  char_device: {foreground: "#884900"}
  socket: {foreground: "#721045"}
  special: {foreground: "#70627f"}
  executable: {foreground: "#006800"}
  mount_point: {foreground: "#005e8b"}

perms:
  user_read: {foreground: "#505050"}
  user_write: {foreground: "#a60000"}
  user_execute_file: {foreground: "#006800"}
  user_execute_other: {foreground: "#006800"}
  group_read: {foreground: "#505050"}
  group_write: {foreground: "#a60000"}
  group_execute: {foreground: "#006800"}
  other_read: {foreground: "#505050"}
  other_write: {foreground: "#a60000"}
  other_execute: {foreground: "#006800"}
  special_user_file: {foreground: "#531ab6"}
  special_other: {foreground: "#a60000"}
  attribute: {foreground: "#70627f"}

size:
  major: {foreground: "#505050"}
  minor: {foreground: "#354fcf"}
  number_byte: {foreground: "#70627f"}
  number_kilo: {foreground: "#505050"}
  number_mega: {foreground: "#354fcf"}
  number_giga: {foreground: "#531ab6"}
  number_huge: {foreground: "#721045"}
  unit_byte: {foreground: "#70627f"}
  unit_kilo: {foreground: "#354fcf"}
  unit_mega: {foreground: "#531ab6"}
  unit_giga: {foreground: "#721045"}
  unit_huge: {foreground: "#354fcf"}

users:
  user_you: {foreground: "#884900"}
  user_root: {foreground: "#a60000"}
  user_other: {foreground: "#531ab6"}
  group_yours: {foreground: "#70627f"}
  group_other: {foreground: "#505050"}
  group_root: {foreground: "#a60000"}

links:
  normal: {foreground: "#0031a9"}
  multi_link_file: {foreground: "#005e8b"}

git:
  new: {foreground: "#005000"}
  modified: {foreground: "#884900"}
  deleted: {foreground: "#a60000"}
  renamed: {foreground: "#005e8b"}
  typechange: {foreground: "#531ab6"}
  ignored: {foreground: "#70627f"}
  conflicted: {foreground: "#721045"}

