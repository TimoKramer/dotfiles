  video: {foreground: "#721045"}
  music: {foreground: "#354fcf"}
  lossless: {foreground: "#005e8b"}
  crypto: {foreground: "#70627f"}
  document: {foreground: "#505050"}
  compressed: {foreground: "#531ab6"}
  temp: {foreground: "#884900"}
  compiled: {foreground: "#005e8b"}
  build: {foreground: "#70627f"}
  source: {foreground: "#005000"}

punctuation: {foreground: "#70627f"}
