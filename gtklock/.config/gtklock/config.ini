[main]
gtk-theme=Arc-Dark
time-format=%l:%M %p
start-hidden=1
modules=userinfo-module;powerbar-module;keyboard-layout-module

[userinfo]
round-image=true
horizontal-layout=false
under-clock=true

[powerbar]
show-labels=true
linked-buttons=true
reboot-command=systemctl reboot
poweroff-command=systemctl -i poweroff
suspend-command=systemctl suspend
userswitch-command=
logout-command=niri msg action exit

[keyboard-layout]
layout-command=/home/timo/.config/niri/scripts/current-layout.sh
switch-command=niri msg action switch-layout next
refresh-interval=1000
debug=0
